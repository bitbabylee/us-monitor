name: 每日看板

on:
  schedule:
    # 盘前版（美东 08:30 = UTC 12:30，夏令时）—— 开盘前做当日计划
    - cron: '30 12 * * 1-5'
    # 收盘版（美东 16:30 = UTC 20:30，夏令时）—— 收盘复盘
    - cron: '30 20 * * 1-5'
  workflow_dispatch: {}          # 手动触发
  push:
    branches: [main]
    paths: ['us_monitor/**', 'build_site.py', '.github/workflows/dashboard.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Chromium（整页截图 + capexcycle 抓取用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq chromium-browser || sudo snap install chromium

      - name: 生成看板
        run: python3 build_site.py
        env:
          TZ: America/New_York

      - name: 提交产物与状态文件
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # 状态文件要一起提交，否则每次 CI 都是全新状态：
          # .alerts_state.json 管🔔去重、.cache_earnings.json 管财报缓存、
          # .capex_series.json 管季度时间序列、.tv_symbols.json 管交易所映射
          git add -f docs/ us_monitor/.alerts_state.json us_monitor/.cache_earnings.json \
                     us_monitor/.capex_series.json us_monitor/.tv_symbols.json us_monitor/.optflow_state.json 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "看板更新 $(TZ=America/New_York date +'%F %H:%M ET')"
            git push
          else
            echo "无变化，跳过提交"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
